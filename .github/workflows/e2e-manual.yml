name: e2e-manual

# 배포된 도메인 E2E 를 **수동으로** 돌린다.
#
# ci.yml 의 `deployed-revision-smoke` 는 main push 에서만 돈다. 그 사이에 배포처 상태를 확인하고
# 싶거나, 다른 URL(로컬 compose·임시 미리보기)을 대상으로 같은 스펙을 돌리고 싶을 때 이걸 쓴다.
#
# 왜 ci.yml 에 workflow_dispatch 를 얹지 않았나:
#   수동 실행에는 비교 기준(base ref)이 없어 `changes` 잡의 paths-filter 가 정상 판정을 못 한다.
#   그 결과 5분짜리 E2E 하나를 보려고 백엔드 빌드·테스트 체인이 통째로 돈다.
#   이 워크플로는 E2E 만 떼어내 돌린다.
#
# 주의: 대상은 **지금 그 URL 에 떠 있는 revision** 이다. 이 워크플로를 돌린 브랜치의 코드가 아니다.
# shop 데모는 david 노드의 docker compose 라 자동 승격이 없다 — 방금 머지한 코드를 보고 싶으면
# 먼저 그 노드에서 배포를 갱신한 다음 이걸 눌러야 한다(ADR 0044).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "E2E 대상 URL"
        required: false
        default: "https://shop.lemuel.co.kr"
        type: string
      projects:
        description: "실행할 Playwright 프로젝트"
        required: false
        default: all
        type: choice
        options:
          - all
          - mobile-only
          - chromium-only

# 같은 브랜치에서 연속으로 누르면 앞 실행을 취소한다 — 수동 확인용이라 최신 것만 의미가 있다.
concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (manual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 단일 출처: 리포 루트 .nvmrc (node-version-gate 가 frontend/Dockerfile 과 major 일치 강제)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts: 설치 단계에서 의존성의 lifecycle 스크립트를 실행하지 않는다
        # (침해된 패키지가 러너 토큰에 닿는 공급망 경로 차단). 실측 확인 — 이 설치로도
        # vite build·vitest 707건이 그대로 통과한다(esbuild 는 플랫폼 optional dep 로 해결).
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers (chromium/firefox/webkit)
        working-directory: frontend
        run: npm run e2e:install

      # ci.yml 쪽에는 배포처 도달 확인(probe) 후 스킵하는 분기가 있지만 여기에는 없다.
      # 수동 실행은 사람이 대상을 지정해 누른 것이라, 닿지 않으면 그 자체가 알고 싶은 결과다.
      - name: Run Playwright E2E
        working-directory: frontend
        run: |
          case "${{ inputs.projects }}" in
            mobile-only)   npm run e2e -- --project=mobile-chrome --project=mobile-safari ;;
            chromium-only) npm run e2e -- --project=chromium ;;
            *)             npm run e2e ;;
          esac

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-manual
          path: frontend/playwright-report/
          retention-days: 14
