name: ci

# 이 저장소는 **main 단일 브랜치**로 운영한다 (2026-08-25).
#   settlement 에서 떼어 오면서 develop→main 2단 브랜치 모델이 같이 딸려 왔지만, 이 저장소에는
#   그 모델이 전제하던 것이 하나도 없다 — 승격 대상인 staging 환경도, 상시 열린 릴리스 PR 도,
#   develop 을 바라보는 배포도 없었다. 실제로 develop 의 유일한 커밋(cfe3d6c)은 main 이 따로
#   반영해 두 브랜치 내용이 완전히 같았다(diff 0). 있지도 않은 승격 단계를 유지하는 대가로
#   커밋 하나가 런 2벌을 만들고 있었을 뿐이라 develop 을 삭제했다.
#   그래서 게이트는 main push 와 main 을 향한 PR 뿐이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 연속 push 는 러너를 두고 다툰다. "어느 실행을 살릴 것인가" 가 이 블록의 전부다.
#
#   main push 만 직렬화한다 — 이미지 푸시와 배포 스모크가 걸려 있어 중간에 끊으면 안 된다.
#   PR 은 **최신 커밋이 이긴다**.
#
# PR 을 직렬화에서 뺀 이유 (2026-08-15 실측, 당시 develop 기준이지만 근거는 그대로다):
#   ① 직렬화의 전제였던 "백엔드 잡 정상 55~70분" 이 낡았다. 모듈 매트릭스로 쪼갠 뒤 전체 런은
#      13~14분이다(run 31872579719 push 14분 · 31872582987 pull_request 13분). 오래 도니까
#      취소하지 말자는 근거가 사라졌다.
#   ② 직렬화는 대기열에서 **최신 커밋을 떨어뜨린다**. concurrency 그룹의 대기 슬롯은 1개뿐이라
#      새 push 가 오면 앞서 대기하던 실행이 취소되는데, 정작 러너를 쥐고 있는 것은 가장 낡은
#      실행이다. 08:07~08:53 실측: push 런 6건 중 완주 0건, 최신 커밋(31bcbd27e)은
#      pending 에서 취소되고 낡은 커밋이 러너를 붙들었다 — 판정이 낡은 트리로 간다.
#
# 단일 브랜치의 대가는 분명히 적어 둔다: main 직접 push 는 **PR 런의 전량 검증을 건너뛰고**
# 직전 커밋 대비 경로 필터로만 게이트된다(아래 "Resolve paths-filter base"). 여러 모듈에
# 걸치는 변경은 PR 로 올려 전량 검증을 한 번 태우는 편이 안전하다.
concurrency:
  group: ci-${{ github.ref }}
  # pull_request 의 github.ref 는 refs/pull/<n>/merge 라 이 조건에서 자연히 true 가 된다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: "25"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # dorny/paths-filter 는 pull_request 이벤트에서 변경 파일 목록을 GitHub API(listFiles)로 읽는다.
    # 리포의 default workflow permissions 가 read 로 내려가 있으면 이 잡만 조용히 실패하고,
    # 뒤따르는 backend/frontend 잡이 전부 skipping 이 되어 *게이트 없이 초록불*이 된다
    # (2026-08-01 PR #199 에서 실측: "Resource not accessible by integration").
    # 리포 기본 설정과 무관하게 돌도록 최소 권한을 명시한다.
    permissions:
      contents: read
      pull-requests: read
      # 마지막 green 런의 커밋을 읽어 변경 감지 기준으로 쓴다(아래 "Resolve paths-filter base").
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # 변경된 백엔드 서비스만 담은 이미지 빌드 매트릭스: {"include":[{module,image_suffix},...]}
      build_matrix: ${{ steps.setmatrix.outputs.matrix }}
      # 빌드할 서비스가 하나라도 있으면 true (backend-ghcr 실행 게이트)
      build_any: ${{ steps.setmatrix.outputs.any }}
      # 모듈별 테스트 매트릭스: {"include":[{module},...]} — backend-test 가 모듈당 잡 하나로 병렬 실행한다.
      # 단일 잡이던 시절 백엔드는 14~43분이 걸렸고, 그 사이 다음 push 가 오면 concurrency 대기 슬롯
      # (그룹당 1개)에서 밀려나 취소됐다 — 2026-08-14 실측으로 develop ci 20건 중 완주 2건.
      test_matrix: ${{ steps.setmatrix.outputs.test_matrix }}
      test_any: ${{ steps.setmatrix.outputs.test_any }}
      # shared-common(composite included build) 변경 여부 — 루트 build 태스크는 included build 의
      # test 를 실행하지 않으므로, true 면 backend-ci 가 shared-common 자체 게이트를 별도 실행한다.
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 변경 감지의 기준점을 정한다 — 이 한 값이 "무엇을 돌릴지" 전부를 좌우한다.
      #
      # 문제 (2026-08-16 실측): base 를 주지 않으면 dorny 는 **기본 브랜치와의 merge-base** 를
      #   기준으로 삼는다. 브랜치가 기본 브랜치보다 크게 벌어져 있으면 무엇을 바꿨든 수백 파일
      #   변경으로 잡히고 → shared 필터(build.gradle.kts·Dockerfile·ci.yml)가 반드시 걸려 →
      #   언제나 "전 서비스 재빌드" 분기가 된다. 실제로 문서 2개·tsx 2개만 바꾼 push 가 백엔드
      #   모듈 19개를 전부 돌렸다(run 31892010325: "Detected 274 changed files").
      #   경로 필터가 정교하게 짜여 있는데 입력이 틀려서 무력화돼 있던 것이다.
      #
      # 그래서 역할을 나눈다:
      #   - push(main)        → **마지막으로 green 이었던 커밋** 대비. 아래에 이유가 있다.
      #   - pull_request      → base 를 비운다(= PR base = main). **머지 전 전량 검증은 그대로**.
      #     단일 브랜치 운영에서 전량 검증이 도는 곳은 여기뿐이다 — 넓은 변경은 PR 로 올릴 것.
      #
      # 왜 github.event.before 가 아닌가 (이 스텝의 핵심):
      #   before 는 "직전 push 의 head" 다. 그 값이 옳으려면 **모든 push 가 자기 런을 완주**해야
      #   하는데, 이 저장소는 그렇지 않다. main 은 cancel-in-progress=false 라 직렬화되지만
      #   concurrency 대기 슬롯은 그룹당 1개뿐이라, 연달아 push 하면 가운데 push 의 런이
      #   **pending 상태에서 취소된다**. 그 취소된 런이 담당하던 구간은 어느 런도 보지 않는다:
      #     push A(프론트) 런 진행 → push B 대기 → push C 도착 → B 취소, C 의 base=B 의 head.
      #   결과적으로 A..B 의 프론트 변경은 C 의 diff 에 안 들어가고 frontend 잡이 통째로 skip 된다.
      #   경로 필터는 정상 동작했다 — 기준점이 "검증됐다고 가정한 커밋" 이었던 게 문제다.
      #
      # 그래서 기준을 **실제로 통과한 마지막 커밋**으로 바꾼다(누적 diff). 런이 취소되든 실패하든
      # 그 구간은 다음 런의 diff 에 계속 남고, green 이 난 뒤에야 기준이 앞으로 간다.
      # 대가: CI 가 오래 빨간불이면 diff 가 넓어져 전 모듈이 돈다. 그 방향의 오차는 안전하다.
      #
      # 안전 폴백 순서: 마지막 green → github.event.before → 빈 값(전량 검증).
      #   최초 push·force-push 는 before 가 0000… 이거나 사라진 커밋을 가리킨다. 판단이 갈릴
      #   때는 더 도는 쪽이 옳다.
      - name: Resolve paths-filter base
        id: filter_base
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # 이 워크플로의 마지막 성공 런이 본 커밋. 실패해도 파이프라인을 죽이지 않는다 —
            # 못 읽으면 아래 폴백이 받는다.
            last_green="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${BRANCH}&status=success&event=push&per_page=1" \
              --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)"

            if [ -n "${last_green:-}" ] && [ "$last_green" != "null" ] \
              && git cat-file -e "${last_green}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$last_green" HEAD 2>/dev/null; then
              base="$last_green"
              echo "변경 감지 기준: 마지막 green 커밋 ${last_green} (누적 diff)"
            elif [ -n "${BEFORE:-}" ] \
              && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
              echo "마지막 green 을 못 찾음 → 직전 커밋 ${BEFORE} 로 폴백"
            else
              echo "기준 커밋을 찾을 수 없다(green=${last_green:-<none>} before=${BEFORE:-<empty>}) → 전량 검증"
            fi
          else
            echo "pull_request → PR base(main) 와 비교한다(전량 검증)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 빈 문자열이면 dorny 기본 동작(기본 브랜치와 비교) — 위 스텝의 폴백이 이 값을 낸다.
          base: ${{ steps.filter_base.outputs.base }}
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - '**'
              - '!frontend/**'
            # shared: 전 서비스 이미지에 영향 → 변경 시 17개 전부 재빌드
            # (건수 정본은 settings.gradle.kts — 아래 커버리지 대조 스텝이 같은 출처를 읽는다)
            shared:
              - 'shared-common/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            order-service: ['order-service/**']
            gateway-service: ['gateway-service/**']
            operation-service: ['operation-service/**']

      - name: Compute image build matrix (changed services only)
        id: setmatrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }} # dorny: 매치된 필터명 JSON 배열
        run: |
          set -euo pipefail
          # 배포 단위 단일 출처: module → image_suffix (아래 backend-ghcr 주석의 매핑과 반드시 일치)
          mapping='{
            "order-service":"",
            "gateway-service":"-gateway",
            "operation-service":"-operation"
          }'
          if echo "$CHANGED" | jq -e 'index("shared")' >/dev/null; then
            # 공용 변경 → 전 서비스 재빌드
            include=$(echo "$mapping" | jq -c '[to_entries[] | {module:.key, image_suffix:.value}]')
          else
            # 변경된 서비스만 (필터명 == 모듈 디렉터리명)
            include=$(echo "$mapping" | jq -c --argjson ch "$CHANGED" \
              '[to_entries[] | select(.key as $k | $ch | index($k)) | {module:.key, image_suffix:.value}]')
          fi
          count=$(echo "$include" | jq 'length')
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "이미지 빌드 대상 서비스: ${count}개 → $include"
          # 테스트 매트릭스: shared 변경→전 모듈, 변경 서비스만 있으면 해당 모듈만,
          # 그 외(모듈·shared 모두 아닌 모호한 backend 변경)→안전하게 전 모듈 (게이트 약화 방지).
          # 태스크 문자열이 아니라 **모듈 목록**을 낸다 — 잡을 모듈당 하나로 쪼개 병렬 실행하기 위해서다.
          if echo "$CHANGED" | jq -e 'index("shared")' >/dev/null || [ "$count" -eq 0 ]; then
            test_modules=$(echo "$mapping" | jq -c 'keys')
          else
            test_modules=$(echo "$include" | jq -c '[.[].module]')
          fi
          test_include=$(echo "$test_modules" | jq -c '[.[] | {module: .}]')
          echo "test_matrix={\"include\":$test_include}" >> "$GITHUB_OUTPUT"
          echo "test_any=$(echo "$test_include" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "테스트 대상 모듈: $(echo "$test_modules" | jq 'length')개 → $test_modules"

  # shared-common 은 composite included build — 루트 build 태스크는 jar 만 만들 뿐 included build 의
  # test 를 실행하지 않는다. 호출 형태가 `-p shared-common` 으로 달라 모듈 매트릭스에 넣을 수 없어
  # 별도 잡으로 분리한다. 자체 게이트(LINE 90% + outbox.domain INSTRUCTION 80%)는 그대로 강제된다.
  backend-shared:
    name: Backend - Test (shared-common)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Login to GHCR (for Testcontainers pulls)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 레지스트리 스로틀일 때만 재시도한다. max-parallel 스로틀(아래 matrix 잡 참고)로도 남는
      # 구멍이 있다 — 이 잡은 matrix 밖이라 스로틀 대상이 아니고, 러너들은 egress IP 를 공유하므로
      # repo.maven.apache.org 가 429/403 을 뱉으면 의존성 해석 단계에서 통째로 죽는다
      # (2026-08-22 실측: gson 2.10.1 403 Forbidden, 23초 만에 BUILD FAILED — 테스트 0건 실행).
      # Gradle 은 HTTP 4xx 를 재시도하지 않으므로 여기서 감싼다.
      #
      # 테스트 실패는 절대 재시도하지 않는다. 로그에 레지스트리 스로틀 흔적이 있을 때만 다시 돈다 —
      # 무조건 재시도하면 플래키 테스트를 초록으로 덮고 실패 원인을 감춘다.
      - name: Build & Test shared-common (JaCoCo gate)
        run: |
          set +e
          for attempt in 1 2 3; do
            ./gradlew -p shared-common clean build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-shared-common.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && exit 0
            grep -qE 'Received status code (403|429) from server|Too Many Requests' \
              /tmp/gradle-shared-common.log || exit "$status"
            echo "::warning::메이븐 레지스트리 스로틀로 실패 — ${attempt}차 재시도"
            sleep $((attempt * 30))
          done
          echo "::error::재시도 3회 모두 레지스트리 스로틀로 실패했다 — 일시 장애가 아니라 조달 구조를 봐야 한다"
          exit 1
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # 모듈당 잡 하나. 단일 잡이던 시절 이 단계가 14~43분이었고, 그 사이 다음 push 가 오면
  # concurrency 대기 슬롯(그룹당 1개)에서 밀려 취소됐다 — 2026-08-14 실측 develop ci 20건 중 완주 2건.
  # 이제 벽시계 시간은 "가장 느린 단일 모듈"로 수렴한다(전체 합이 아니라).
  # max-parallel 은 두지 않는다 — 계정 동시 실행 상한에 맞춰 GitHub 이 알아서 큐잉한다.
  backend-test:
    name: Backend - Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 단일 모듈 기준. hang 시 러너 6시간 낭비 방지
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.test_any == 'true'
    permissions:
      contents: read
      packages: read # ghcr 미러 이미지 pull (mirror-testcontainers.yml 참고)
    strategy:
      fail-fast: false # 한 모듈 실패가 나머지 모듈의 판정을 가리지 않도록
      # Maven Central / plugins.gradle.org 429 방지용 스로틀.
      #
      # 의존성이 바뀌는 PR(dependabot bump 등)에서는 setup-java 의 gradle 캐시 키가 통째로
      # 어긋나 19개 잡이 *동시에* 콜드 리졸브를 돈다. 러너들은 egress IP 를 공유하므로
      # repo.maven.apache.org 가 429 Too Many Requests 를 뱉고, 잡은 테스트를 시작하지도
      # 못한 채 죽는다 — 2026-08-19 하루에만 #284 board-service, #288 deposit-service,
      # #287 gateway-service 가 이 이유로 빨갛게 떴고 셋 다 재실행만으로 통과했다.
      # (Testcontainers 이미지 쪽 rate limit 은 이미 ghcr 미러로 우회했다. 이건 그 짝인
      #  *메이븐 아티팩트* 쪽 구멍이다.)
      #
      # 5 로 조이면 콜드 리졸브가 4 웨이브로 나뉜다. 모듈당 3~6분이라 전체 벽시계는
      # 늘지만, 재실행 한 번이 15분이고 사람이 원인을 오해하는 비용은 그보다 크다.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    services:
      postgres:
        # Docker Hub rate limit 회피 — ghcr 미러 사용 (mirror-testcontainers.yml 로 갱신)
        image: ghcr.io/myoungsoo7/mirror/postgres:17
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트가 서비스 PG 를 쓸 수 있도록 스키마를 빌드 전에 준비.
      #
      # apt 로 postgresql-client 를 깔지 않는다. 매트릭스 19개 잡이 매번 우분투 미러를 때렸고,
      # azure.archive.ubuntu.com 이 응답을 멈추면 apt 가 폴백 미러에서 그대로 얼어붙어 45분
      # timeout-minutes 를 통째로 태웠다 — GitHub 은 그걸 실패가 아니라 conclusion=cancelled 로
      # 보고하므로 PR 에는 원인 없는 빨간 X 로만 보인다(2026-08-19 실측: #285 에서 19개 중 7개,
      # #283 에서 19개 중 4개가 이렇게 죽었고 gradle 은 실행조차 못 했다).
      #
      # psql 은 postgres 서비스 컨테이너 안에 이미 있다. 거기서 실행하면 외부 네트워크 의존이
      # 사라지고 이 스텝은 1초로 끝난다. 컨테이너는 5432 를 게시한 유일한 컨테이너로 찾는다
      # (ES 서비스는 9200 만 게시한다). 컨테이너 안에서는 unix 소켓 + local trust 라 암호가 필요 없다.
      - name: Init schema (opslab)
        timeout-minutes: 2 # 얼어붙으면 45분이 아니라 2분 만에 죽어야 원인이 보인다
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "publish=5432" --format '{{.ID}}' | head -n1)
          if [ -z "$cid" ]; then
            echo "::error::5432 를 게시한 컨테이너가 없다 — postgres 서비스 컨테이너 구성을 확인하라"
            docker ps
            exit 1
          fi
          docker exec "$cid" psql -U testuser -d testdb -c "CREATE SCHEMA IF NOT EXISTS opslab;"

      # Testcontainers 가 ghcr 미러(비공개 패키지 가능)에서 pull 할 수 있게 데몬 로그인.
      # Docker Hub rate limit 회피 — 각 모듈 testcontainers.properties 의
      # hub.image.name.prefix=ghcr.io/myoungsoo7/mirror/ 와 세트.
      - name: Login to GHCR (for Testcontainers pulls)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build = compile + test + jacocoTestReport + jacocoTestCoverageVerification (게이트 포함, build.gradle.kts:157)
      # Testcontainers 기반 통합테스트는 러너의 Docker 데몬을 사용한다.
      - name: Build & Test ${{ matrix.module }} (JaCoCo gate)
        # 레지스트리 스로틀일 때만 재시도 — 근거와 규칙은 위 shared-common 잡 주석 참고.
        # (max-parallel 5 로 콜드 리졸브를 4 웨이브로 나눠도 429 가 완전히 사라지지는 않았다.)
        run: |
          set +e
          for attempt in 1 2 3; do
            ./gradlew clean :${{ matrix.module }}:build --no-daemon --stacktrace 2>&1 \
              | tee /tmp/gradle-${{ matrix.module }}.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && exit 0
            grep -qE 'Received status code (403|429) from server|Too Many Requests' \
              /tmp/gradle-${{ matrix.module }}.log || exit "$status"
            echo "::warning::메이븐 레지스트리 스로틀로 실패 — ${attempt}차 재시도"
            sleep $((attempt * 30))
          done
          echo "::error::재시도 3회 모두 레지스트리 스로틀로 실패했다 — 일시 장애가 아니라 조달 구조를 봐야 한다"
          exit 1
        env:
          # ryuk(정리용 유틸 컨테이너) 비활성화 — 러너는 일회용이라 불필요하고,
          # 이미지 치환과 얽혀 모듈별 test JVM 에서 비결정적 hang 을 유발했다 (2026-07-08).
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200

      # 집계 잡이 이 아티팩트를 `<module>/build/reports/` 로 되돌려 놓아야 Sonar 의
      # sonar.coverage.jacoco.xmlReportPaths 와 PR 코멘트 글롭이 경로를 찾는다.
      # 업로드 루트를 모듈의 reports 디렉터리로 두고, 모듈명은 **아티팩트 이름**에 실어 복원 시 재구성한다.
      - name: Upload test/coverage reports (${{ matrix.module }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/
          retention-days: 30
          if-no-files-found: ignore

  backend-ci:
    # ⚠ 이 이름을 바꾸지 말 것 — ruleset 의 **필수 상태 체크**로 등록된 문자열이다.
    #   잡을 쪼개면서 이 이름이 사라지면 체크가 영영 보고되지 않아 main PR 이 영구 대기에 빠진다.
    #   모듈 잡 이름은 매트릭스라 가변이므로 필수 체크로 걸 수 없다 — 그래서 집계 잡이 이름을 물려받는다.
    name: Backend - Build/Test/JaCoCo/SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes, backend-shared, backend-test]
    # always() 가 필수다. 기본 동작은 needs 실패 시 이 잡을 **skip** 인데, 필수 체크에서 skip 은
    # 통과로 취급된다 — 모듈 하나가 깨져도 게이트가 조용히 사라진다(이 파일 상단 changes 잡 주석과 같은 실패 양식).
    if: always() && !cancelled() && needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # 스킵을 통과로 읽지 않는다 — 변경 없음(skipped)만 허용하고 failure/cancelled 는 여기서 떨어뜨린다.
      - name: 모듈 테스트 결과 집계
        run: |
          set -euo pipefail
          echo "backend-shared: ${{ needs.backend-shared.result }}"
          echo "backend-test  : ${{ needs.backend-test.result }}"
          for result in "${{ needs.backend-shared.result }}" "${{ needs.backend-test.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::백엔드 모듈 테스트가 통과하지 않았다 (result=$result)"; exit 1 ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download module coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-reports-*
          path: artifacts

      # 모듈 잡에서 올라온 리포트를 원래 경로로 되돌린다. 아티팩트 이름의 접미사가 모듈명이다.
      #
      # 가드를 "0개면 실패"에서 **집합 대조**로 올렸다 (2026-08-15).
      #   전에는 count -eq 0 만 봤기 때문에 *부분* 유실이 조용히 통과했다. 그런데 Sonar 는 리포트가
      #   없는 모듈을 건너뛰지 않고 0% 로 집계한다 — develop 분석 2026-08-15T07:52 실측에서
      #   17개 중 11개가 0% 로 들어가 전체 coverage 57.7%, 품질 게이트 ERROR 가 됐다.
      #   이제 두 집합을 갈라 본다:
      #     ① 돌았어야 하는데 리포트가 없다(expected − restored) → 아티팩트 배선 결함 → 실패
      #     ② 애초에 안 돌았다(all − expected)                  → 정상. 이번 실행 커버리지 집계에서
      #        제외되며(build.gradle.kts 의 sonar.coverage.exclusions), 어느 모듈이 빠졌는지 남긴다.
      - name: Restore report paths
        id: coverage
        env:
          TEST_MATRIX: ${{ needs.changes.outputs.test_matrix }}
          TEST_RESULT: ${{ needs.backend-test.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # ⚠ download-artifact 레이아웃 정규화 (2026-08-22 run 32590175490 실측 결함).
          #   `pattern:` + `merge-multiple: false` 는 **매치가 2개 이상일 때만** 아티팩트별 하위
          #   디렉토리(artifacts/backend-reports-<module>/)를 만든다. 정확히 **1개면 내용물을
          #   path 에 곧장** 푼다 — 로그가 "Starting download of artifact to: .../artifacts" 로
          #   끝나고 하위 디렉토리가 없다. 그러면 아래 글로브가 0회 돌아 restored 가 비고,
          #   "테스트는 통과했는데 커버리지가 복원되지 않았다"로 판정된다. 즉 **백엔드 모듈이
          #   정확히 하나만 바뀐 푸시마다 필수 게이트가 실패**한다(매트릭스 분할 이후 잠복).
          #
          #   기대 모듈이 정확히 하나일 때만 되돌린다. 여러 모듈이 기대되는데 아티팩트가 하나뿐인
          #   상태는 **진짜 배선 결함**이므로 정규화하지 않고 아래 대조에서 실패해야 한다.
          if [ -n "${TEST_MATRIX:-}" ] && [ -d artifacts ] \
            && [ -z "$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'backend-reports-*' -print -quit)" ] \
            && [ -n "$(ls -A artifacts)" ]; then
            single=$(printf '%s' "$TEST_MATRIX" | jq -r '.include[].module' | sort -u)
            if [ "$(printf '%s\n' "$single" | grep -c . || true)" -eq 1 ]; then
              echo "단일 아티팩트가 하위 디렉토리 없이 풀렸다 — backend-reports-$single 로 정규화한다"
              mkdir -p "artifacts/backend-reports-$single"
              find artifacts -mindepth 1 -maxdepth 1 ! -name "backend-reports-$single" \
                -exec mv {} "artifacts/backend-reports-$single/" \;
            fi
          fi

          for dir in artifacts/backend-reports-*; do
            module="${dir#artifacts/backend-reports-}"
            mkdir -p "$module/build/reports"
            cp -r "$dir/." "$module/build/reports/"
          done

          # ⚠ nullglob + `ls -1 <패턴>` 을 쓰면 안 된다 (2026-08-22 실측으로 확인한 결함).
          #   이 스텝은 위의 아티팩트 루프 때문에 nullglob 을 켠다. 그 상태에서 XML 이 하나도 없으면
          #   패턴이 **통째로 사라져** 명령이 인자 없는 `ls -1` 이 되고, 저장소 루트 전체가 출력된다.
          #   그러면 restored 에 AGENTS.md·CLAUDE.md 같은 파일과 함께 *모듈 디렉토리 이름까지* 들어가
          #   아래 두 대조가 동시에 무력화된다:
          #     · missing(expected − restored) = 공집합 → 아티팩트 배선이 통째로 끊겨도 통과
          #     · uncovered(all − restored)    = 공집합 → 미측정 모듈 기록조차 안 남음
          #   실측 근거: run 32530600570 로그 "복원된 커버리지 XML: 51개 / restored: AGENTS.md
          #   ARCHITECTURE.md CLAUDE.md Dockerfile …" — 그 실행의 백엔드 테스트는 skipped 였다.
          #   글로브 결과를 for 로 받으면 nullglob 에서 루프가 0회 돌아 의도대로 빈 값이 된다.
          restored=$(for f in */build/reports/jacoco/test/jacocoTestReport.xml; do echo "${f%%/*}"; done | sort -u)
          # 모듈 로스터 정본은 settings.gradle.kts (coverage-scope-gate 테스트와 같은 출처)
          all=$(sed -n '/^include(/,/^)/p' settings.gradle.kts | grep -oE '"[a-z-]+-service"' | tr -d '"' | sort -u)
          # jq 실패를 2>/dev/null 로 삼키지 않는다 — 삼키면 expected 가 비어 대조가 통째로 무력화되고
          # 가드가 "이상 없음"으로 오판한다(정확히 이 가드가 없애려는 실패 양식이다).
          if [ -n "${TEST_MATRIX:-}" ]; then
            expected=$(printf '%s' "$TEST_MATRIX" | jq -r '.include[].module' | sort -u)
          else
            expected=""
          fi

          echo "복원된 커버리지 XML: $(echo "$restored" | grep -c . || true)개"
          echo "  restored: $(echo "$restored" | tr '\n' ' ')"
          echo "  expected: $(echo "$expected" | tr '\n' ' ')"

          missing=$(comm -23 <(echo "$expected") <(echo "$restored") | grep . || true)
          if [ -n "$missing" ] && [ "$TEST_RESULT" = "success" ]; then
            echo "::error::테스트는 통과했는데 커버리지 XML 이 복원되지 않은 모듈이 있다 — 아티팩트 배선을 확인할 것: $(echo "$missing" | tr '\n' ' ')"
            exit 1
          fi

          uncovered=$(comm -23 <(echo "$all") <(echo "$restored") | grep . || true)
          if [ -n "$uncovered" ]; then
            echo "::notice title=커버리지 미측정 모듈::이번 실행에서 테스트가 돌지 않아 Sonar 커버리지 집계에서 제외된다(0% 오보고 방지): $(echo "$uncovered" | tr '\n' ' ')"
          fi

          # 커버리지를 한 모듈도 못 실은 회차인지 아래 Sonar 스텝에 알린다.
          # (판정은 그쪽 주석 참조 — 여기서는 사실만 내보낸다.)
          if [ -n "$restored" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/*/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ 순서 주의: SCA(보안 게이트)가 SonarCloud(품질 분석)보다 *먼저* 온다.
      #   원래는 반대였는데, 2026-08-12 run 31602739861 에서 SONAR_TOKEN 만료(HTTP 403)로
      #   Sonar 스텝이 실패하자 뒤따르던 SBOM·Trivy 가 통째로 skip 됐다 — 무관한 도구의 인증
      #   문제로 보안 게이트가 조용히 사라진 것이고, 이 작업이 없애려던 실패 양식 그대로다.
      #   보안 게이트를 앞에 두면 품질 도구의 사정과 무관하게 항상 판정된다.
      #
      # ── SCA (의존성 취약점) — Snyk 을 걷어내고 SBOM + Trivy 로 갈아탔다 (2026-08-12).
      #
      # Snyk 을 뺀 이유(실측, run 31432558450):
      #   ERROR Authentication error (SNYK-0005) — 토큰이 무효라 스캔 자체가 시작되지 않았고,
      #   ✗ 21/21 detected Gradle manifests did not return dependencies — 의존성 해석도 실패했다.
      #   continue-on-error 가 둘 다 삼켜서 "SCA 가 돌고 있다"는 초록불만 남아 있었다.
      # 지금 방식은 외부 계정·토큰에 의존하지 않는다(전부 러너 안에서 끝난다).
      #
      # CycloneDX 는 루트에 적용하면 17개 서비스 전부를 합친 aggregate BOM 을 만든다
      # (build/reports/cyclonedx/bom.json — 실측 451 컴포넌트).
      - name: Generate SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom --no-daemon

      # if: always() 를 뗐다 — SBOM 생성이 skip/실패했는데도 업로드가 돌아 빈손으로 성공하던
      # 스텝이었다(run 31599697053: Generate 는 skipped, Upload 는 success). 스캔은 이 뒤에
      # 오므로 스캔이 실패해도 이 업로드는 이미 끝나 있다 — always() 가 필요 없다.
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 90

      # 차단 게이트. 기존 부채 48건은 .trivyignore.yaml 에 만료일과 함께 명시돼 있고,
      # 거기 없는 신규 HIGH/CRITICAL 이 하나라도 나오면 exit 1 로 막는다(semgrep.yml 과 같은 기준).
      # version 고정: 이 게이트를 켤 때 부채 건수를 실측한 바이너리와 동일 버전을 쓴다.
      - name: SCA — Trivy SBOM scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: sbom
          scan-ref: build/reports/cyclonedx/bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

      # 게이트다 — continue-on-error 를 뗐다(2026-08-12).
      # 그전까지 이 스텝은 sonarqube 플러그인 5.1.0.4882 가 Gradle 9 에서 제거된 Convention API 를
      # 호출해 NoSuchMethodError 로 13초 만에 죽었고, continue-on-error 가 그걸 삼켰다.
      # 즉 SonarCloud 분석은 한 번도 업로드된 적이 없다(run 31432558450 로그가 근거).
      # 지금 이 스텝이 막는 것은 "분석이 안 돌았다"까지다 — 플러그인 크래시·토큰 만료처럼
      # 분석 자체가 실패하면 이 잡이 깨지고, 그러면 backend-ghcr 가 이미지를 만들지 않는다.
      # 품질 게이트 *내용*은 아직 차단하지 않는다(sonar.qualitygate.wait=false, build.gradle.kts).
      #
      # ⚠ 현재 SONAR_TOKEN 은 만료 상태다 — run 31602739861 실측:
      #   "GET https://api.sonarcloud.io/analysis/jres... failed with HTTP 403 Forbidden.
      #    Please check the property sonar.token or the environment variable SONAR_TOKEN."
      #   토큰은 2026-02-24 등록분이고 마지막 분석은 2026-02-26 이다. 이 스텝이 초록이 되려면
      #   SonarCloud 에서 토큰을 재발급해 저장소 시크릿 SONAR_TOKEN 을 갱신해야 한다.
      #   아래 유무 가드는 "토큰이 없는" 환경만 덮는다 — 지금처럼 토큰이 있는데 거부되면(403)
      #   이 스텝은 그대로 실패한다. 만료를 조용히 통과시키면 분석이 영영 안 돌아도 초록이 된다.

      # 토큰 유무 판정을 스캔에서 분리한다: secrets 컨텍스트는 step 의 if 에서 쓸 수 없고, 스텝 자신의
      # env 도 그 스텝의 if 가 평가되는 시점에는 없다. 그래서 앞선 스텝의 output 으로 옮긴다.
      # 시크릿이 없는 환경(포크, 시크릿 미설정 클론)에서 "토큰이 없어서" 잡이 깨지는 것을 막되,
      # 스킵을 조용히 넘기지 않고 ::warning:: 으로 남긴다 — 스킵을 "분석 통과"로 오독하면 안 된다.
      #
      # 검증 상태(2026-08-13, 다음 사람이 같은 질문을 반복하지 않도록 기록):
      #   ✔ 출력 배선 + 참 분기 — run 31611508158 에서 이 스텝과 아래 스캔 스텝이 둘 다 success.
      #     id/outputs 오타였다면 표현식이 거짓이 되어 스캔이 skipped 로 떴을 것이다. 즉 가장 위험한
      #     실패 모드("오타 때문에 분석이 영원히 조용히 스킵")는 배제됐다.
      #   ✔ 쉘 로직 — 빈 문자열·변수 미설정 두 경우 모두 present=false + ::warning 발화를 로컬 재현.
      #   ✖ 거짓 분기 전체(빈 시크릿 → env 빈 문자열 → 스킵)는 실측하지 못했다. 실측하려면 운영
      #     워크플로에 테스트 훅(workflow_dispatch 입력)을 심거나 보호 브랜치에 실험 커밋을 넣어야 하는데,
      #     5줄 가드의 잔여 리스크보다 그 오염이 비싸다고 판단했다.
      #     남은 미지수가 틀렸을 때의 결과는 "토큰 없이 스캔 실행 → 요란한 실패"= 가드 도입 전 상태이며,
      #     조용한 통과가 되지는 않는다(실패 방향이 안전하다). 깨끗한 실측 방법은 시크릿을 잠시 비웠다
      #     되돌리는 것뿐이고, 그건 저장소 소유자만 할 수 있다.
      - name: SONAR_TOKEN 유무 확인
        id: sonar_token
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SonarCloud 분석 건너뜀::SONAR_TOKEN 시크릿이 비어 있어 분석을 실행하지 않았다. 저장소 Settings → Secrets 에 토큰을 등록하면 다시 돈다."
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 커버리지를 한 모듈도 싣지 못한 회차는 분석하지 않는다 (2026-08-22 추가).
      #
      # 왜 스킵이 맞는가 — SonarCloud 의 브랜치 품질 게이트는 **마지막 분석 하나**로 결정된다.
      #   커버리지 XML 이 0개면 build.gradle.kts 가 전 모듈에 sonar.coverage.exclusions="**/*" 를
      #   걸어(0% 오보고 방지) 분석에 커버 가능한 라인이 남지 않는다. 그러면 new_coverage 조건이
      #   게이트 결과에서 **통째로 사라지고**, 남은 조건만으로 status=OK 가 된다.
      #   즉 "측정을 못 한 회차"가 "측정해서 실패했던 회차"의 판정을 초록으로 덮어쓴다.
      #   실측(2026-08-22): new_coverage 79.8%(ERROR)였던 develop 이, 백엔드 테스트가 스킵된
      #   문서/파이썬 전용 푸시들의 분석으로 갈아치워지며 status=OK 가 됐다
      #   (api/measures new_lines=40263 인데 new_lines_to_cover=0 — 커버리지 데이터 자체가 없다).
      #
      # 무엇을 잃는가 — 그 회차의 비커버리지 지적(java/githubactions/text 규칙)이 미뤄진다.
      #   영구 유실은 아니다: Sonar 는 매 분석마다 diff 가 아니라 **트리 전체**를 본다. 다음
      #   백엔드 변경 푸시의 분석이 그 파일들을 그대로 다시 읽고, 신규 코드 기준도 시간축
      #   (sonar.leak.period=30)이라 그때도 신규로 잡힌다. 커버리지 판정을 잃는 쪽이 더 비싸다.
      #
      # 그리고 이 조건은 백엔드 테스트가 도는 회차에는 항상 참이라, 실질적인 분석 빈도는
      # "백엔드가 바뀐 푸시마다"로 유지된다.
      - name: SonarCloud 커버리지 미측정 회차 — 분석 건너뜀
        if: github.event_name != 'pull_request' && steps.sonar_token.outputs.present == 'true' && steps.coverage.outputs.present != 'true'
        run: |
          echo "::warning title=SonarCloud 분석 건너뜀(커버리지 없음)::이번 실행은 커버리지 XML 이 0개라 분석하지 않았다. 분석했다면 new_coverage 조건이 빠진 채 품질 게이트가 초록으로 덮어써진다. 백엔드 변경이 포함된 다음 푸시에서 정상 분석된다."

      - name: SonarCloud Scan (analysis must succeed)
        if: github.event_name != 'pull_request' && steps.sonar_token.outputs.present == 'true' && steps.coverage.outputs.present == 'true'
        # DB·ES 환경변수를 뗐다 — 이 잡에는 서비스 컨테이너가 없다(테스트는 backend-test 가 이미 끝냈다).
        # `sonar` 는 subprojects 의 compileJava 에만 의존하므로 DB 가 필요 없다(build.gradle.kts 하단 주석).
        # 없는 포트를 가리키는 값을 남겨두면 "설정돼 있으니 동작한다"는 착시만 만든다.
        run: ./gradlew sonar --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # (제거) 주석 처리돼 있던 sonarqube-quality-gate-action 블록 — build.gradle.kts 의
  # sonar.qualitygate.wait=true 가 같은 일을 하므로(분석 태스크가 게이트 결과를 기다렸다가 실패)
  # 별도 액션이 필요 없다. 죽은 주석은 "게이트가 있다"는 착시만 남긴다.

  backend-ghcr:
    name: Backend - Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [changes, backend-ci]
    # PR 에서도 돈다 — 다만 **푸시하지 않고 빌드·스캔만** 한다(아래 push/load 조건).
    #
    # 이전에는 `github.event_name != 'pull_request'` 라 PR 체크에 docker build 가 아예 없었다.
    # 그래서 Dockerfile 만 바꾼 PR 이 이미지를 한 번도 만들지 않은 채 초록으로 머지된다 —
    # 실측: PR #233(베이스 이미지 bump, 바뀐 파일이 Dockerfile 9개뿐)에서 이미지 잡 3종이
    # 전부 skipped 였고 나머지 테스트 잡이 초록을 만들어 머지됐다. 빌드 파손도, 새 베이스가
    # 물고 온 CRITICAL CVE 도 머지 후 push 실행에서야 드러난다(그때는 이미 늦다 —
    # 이미지가 안 올라가 배포 스큐가 생기거나, 취약 이미지가 레지스트리에 올라간다).
    # 게이트를 두 값에 걸쳐 OR 로 본다 — build_any(불리언 문자열) 하나에만 걸면 그 출력이
    # 어떤 이유로든 'true' 로 전달되지 않는 순간 잡이 조용히 skipped 되고, 필수 체크는 초록인 채
    # 이미지만 사라진다(2026-08-20 실측: order-service 단독 변경 push 2건이 이렇게 묻혔다).
    # 매트릭스 원본이 "빈 매트릭스"가 아니면 빌드할 게 있다는 뜻이므로 그것도 함께 본다.
    #
    # always() && !cancelled() 가 없으면 안 된다 — 상류의 **skipped 가 여기까지 전파**된다.
    # 이 잡의 needs 는 backend-ci 인데, 그 backend-ci 의 needs 에는 backend-shared 가 있다.
    # backend-shared 는 shared 필터(shared-common/**·루트 빌드파일·Dockerfile·ci.yml)에만
    # 걸리므로 평범한 서비스 코드 푸시에서는 skipped 다. backend-ci 는 스스로 always() 를
    # 달아 살아나지만, 상태함수가 없는 이 잡은 암묵 success() 로 판정돼 상류의 skipped 를
    # 그대로 물려받아 함께 skipped 된다 — if 조건이 참이어도, 매트릭스에 모듈이 담겨 있어도.
    #
    # 2026-08-20 실측(ci.yml 최근 run 전수, 예외 0건):
    #   backend-shared=skipped → backend-ghcr=skipped  9/9
    #   backend-shared=success → backend-ghcr=success   3/3
    # backend-shared 잡이 생긴 c31956bd(2026-08-14) 부터 6일간, 서비스 코드만 고친 푸시는
    # 백엔드 이미지가 한 장도 만들어지지 않았다. GHCR 실측으로 develop 태그가
    # develop-71ce7d9(10:43Z) 에 묶인 채 그 뒤 4커밋의 이미지가 없었다 — 코드는 머지됐는데
    # 배포는 옛 이미지에 고정되는 조용한 스큐다. 필수 체크는 내내 초록이었다.
    # always() 로 skip 전파를 끊되, needs.result 를 명시 검사해 **실패는 그대로 막는다**.
    if: >-
      always() && !cancelled()
      && needs.changes.result == 'success'
      && needs.backend-ci.result == 'success'
      && (needs.changes.outputs.build_any == 'true'
      || needs.changes.outputs.build_matrix != '{"include":[]}')
    permissions:
      contents: read
      packages: write
    # 배포 단위별 이미지(ADR 0020) — 변경된 백엔드 서비스만 이미지화(매트릭스는 changes 잡이 계산).
    #   order-service        → ghcr.io/myoungsoo7/shop
    #   gateway-service      → ghcr.io/myoungsoo7/shop-gateway
    #   operation-service    → ghcr.io/myoungsoo7/shop-operation
    # (board·education·notification 은 operation 슬라이스, organization 은 order 슬라이스라
    #  별도 이미지가 없다.)
    # shared-common·루트 빌드파일·Dockerfile·ci.yml 변경 시엔 changes 잡이 위 매핑 전부를 매트릭스에 담는다.
    strategy:
      fail-fast: false # 한 서비스 빌드 실패가 다른 서비스 이미지 푸시를 취소하지 않도록
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 준비: Docker Hub 로그인 (추후 사용)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            # PR 에서는 event=branch 가 태그를 만들지 않는다. 태그가 0개면 build-push 가 설 수 없고
            # (load 대상이 없다) Trivy 의 tags[0] 참조도 깨진다 — PR 전용 태그를 하나 보장한다.
            # push 이벤트에서는 이 줄이 적용되지 않아 기존 태그 구성이 그대로다.
            type=ref,event=pr
            # PR 에서는 {{branch}} 가 빈 문자열이라 태그가 `-<sha7>` 이 된다. 하이픈으로 시작하는
            # 태그는 불법이라 buildx 가 "invalid reference format" 으로 거부한다 — 이 잡이 push
            # 전용이던 동안 드러나지 않던 결함이고, PR 에서 돌게 하면서 노출됐다(실측: frontend
            # 쪽이 `settlement-frontend:-4cdf810` 로 실패). PR 태그는 위 event=pr 이 이미 만든다.
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # buildx 는 --push 와 --load 를 동시에 쓸 수 없다 — 이벤트로 가른다.
          # PR: 로컬 데몬으로 load 해 아래 Trivy 가 **레지스트리 없이** 스캔한다(푸시 안 함).
          # push: 종전대로 GHCR 에 올린다.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dockerfile 의 ARG MODULE 가 비어있으면 'gradle ::bootJar' 처럼 빈 세그먼트가 되어 빌드 실패.
          # matrix.module selects the deployable Gradle service built into this image.
          build-args: |
            MODULE=${{ matrix.module }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # 컨테이너 레이어(OS 패키지 + 번들 라이브러리) 취약점 스캔.
      # Snyk 은 Gradle 의존성만 보고 그마저 continue-on-error 라, 베이스 이미지 CVE 는
      # 지금까지 아무도 보지 않았다.
      # 게이트 범위: CRITICAL + 이미 수정 버전이 나온 것만(ignore-unfixed) — 미수정 CVE 로
      # 파이프라인이 막히는 상황을 피한다. HIGH 까지 조이려면 severity 에 추가할 것.
      # PR 에서는 load 된 로컬 이미지를 **올리기 전에** 스캔한다 — 취약 이미지가 레지스트리에
      # 닿기 전에 막히는 지점이다. push 이벤트에서는 종전대로 올린 뒤 스캔하므로
      # (이미지는 이미 올라간 상태) 잡이 빨개지면 롤백 판단은 사람이 한다.
      #
      # ⚠ 이 액션은 두 번 깨져 있었다 (둘 다 CI 실측으로 잡음):
      #   ① 원래 `@0.28.0` 으로 적혀 있었는데 그런 ref 자체가 없다(실제 태그는 v0.28.0).
      #   ② v0.28.0 은 내부적으로 `aquasecurity/setup-trivy@v0.2.1` 을 부르는데 업스트림에서
      #      그 태그가 사라져, 바깥 액션을 SHA 로 고정해도 잡 시작 즉시
      #      "Unable to resolve action ... unable to find version v0.2.1" 로 죽는다
      #      (2026-08-12 run 31592237712 에서 실측).
      #   v0.36.0 은 setup-trivy 를 커밋 SHA 로 참조해 태그 삭제에 영향을 받지 않는다.
      #   교훈: 액션을 SHA 로 핀해도 그 액션이 내부에서 쓰는 참조까지 고정되지는 않는다.
      - name: Trivy image scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend-ci:
    name: Frontend - Production Build & Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 단일 출처: 리포 루트 .nvmrc (node-version-gate 가 frontend/Dockerfile 과 major 일치 강제)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts: 설치 단계에서 의존성의 lifecycle 스크립트를 실행하지 않는다
        # (침해된 패키지가 러너 토큰에 닿는 공급망 경로 차단). 실측 확인 — 이 설치로도
        # vite build·vitest 707건이 그대로 통과한다(esbuild 는 플랫폼 optional dep 로 해결).
        run: npm ci --ignore-scripts

      # Production typecheck (excludes test files)
      - name: TypeScript type check (production code only)
        working-directory: frontend
        run: npm run typecheck

      # 테스트 코드도 타입 검증한다 — 프로덕션 typecheck 만 돌던 동안 테스트 쪽 타입 오류가
      # 쌓여도 CI 가 잡지 못했다(jest-dom 매처 미배선으로 123건 누적된 전례).
      - name: TypeScript type check (test code)
        working-directory: frontend
        run: npm run typecheck:tests

      # 부채(any 83건·exhaustive-deps 10건·react-refresh 2건)를 모두 정리해 현재 0 problems 이므로
      # `--max-warnings 0` 으로 강제한다 — 경고 하나만 새로 생겨도 CI 가 막는다.
      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      # Build production bundle
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY || 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # ── SCA (의존성 취약점) — backend-ci 와 같은 이유로 Snyk 을 걷어냈다(토큰 무효, 2026-08-12).
      # npm 내장 audit 이라 외부 계정·토큰이 필요 없다.
      #
      # --omit=dev: 게이트 대상은 *프로덕션 번들에 들어가는* 의존성이다. dev 전용(vite·vitest 등)
      #   취약점은 사용자에게 배포되지 않는데 여기서 막으면 노이즈로 게이트가 무시당한다
      #   (실측 2026-08-12: 전체 16건 / 프로덕션 3건). dev 쪽은 Dependabot 이 주간으로 올린다.
      # 차단이다 — continue-on-error 없음. 새 프로덕션 high 취약점이 들어오면 여기서 막힌다.
      - name: SCA — npm audit (production deps, high gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # 프론트 단위/컴포넌트 테스트 게이트.
  # 2026-08-02 까지 `if: false` 로 꺼져 있었고 frontend-ci 에도 `npm test` 가 없어서,
  # Vitest 가 *어느 브랜치에서도 CI 에서 한 번도 돌지 않았다*. 회귀 테스트를 붙여도
  # 게이트가 되지 못했다는 뜻이라(#184 금액 정밀도 수정에서 실측) 켠다.
  # 켜기 전 실측: develop 27 파일 297 테스트 전부 통과, 27초.
  frontend-tests:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 단일 출처: 리포 루트 .nvmrc (node-version-gate 가 frontend/Dockerfile 과 major 일치 강제)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts: 설치 단계에서 의존성의 lifecycle 스크립트를 실행하지 않는다
        # (침해된 패키지가 러너 토큰에 닿는 공급망 경로 차단). 실측 확인 — 이 설치로도
        # vite build·vitest 707건이 그대로 통과한다(esbuild 는 플랫폼 optional dep 로 해결).
        run: npm ci --ignore-scripts

      # coverage 를 켜서 아래 업로드 스텝이 실제로 뭔가를 올리게 한다
      # (test:run 은 coverage/ 를 만들지 않아 업로드가 늘 빈손이었다)
      - name: Run tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage
          retention-days: 30

  frontend-ghcr:
    name: Frontend - Build & Push to GHCR
    runs-on: ubuntu-latest
    # frontend-tests 를 needs 에 넣지 않으면 Vitest 가 실패해도 이미지가 그대로 푸시된다
    # (테스트는 빨간불, 배포는 진행 — 게이트를 켠 의미가 없어진다).
    needs: [changes, frontend-ci, frontend-tests]
    # backend-ghcr 와 같은 이유로 PR 에서도 돈다 — 푸시 없이 빌드·스캔만(아래 push/load).
    # frontend/Dockerfile 도 #233 에 섞여 있었고, 이 잡이 skip 이라 새 nginx 베이스가
    # 빌드되는지도 CVE 가 늘었는지도 PR 에서는 알 수 없었다.
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            # PR 에서는 event=branch 가 태그를 만들지 않는다. 태그가 0개면 build-push 가 설 수 없고
            # (load 대상이 없다) Trivy 의 tags[0] 참조도 깨진다 — PR 전용 태그를 하나 보장한다.
            # push 이벤트에서는 이 줄이 적용되지 않아 기존 태그 구성이 그대로다.
            type=ref,event=pr
            # backend-ghcr 와 같은 이유 — PR 에서 {{branch}} 가 비어 `-<sha7>` 불법 태그가 된다.
            # 실제로 여기서 먼저 터졌다: `settlement-frontend:-4cdf810` (run 31771642040).
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # buildx 는 --push 와 --load 를 동시에 못 쓴다 — PR 은 load 만, push 이벤트는 push 만.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '' }}
            VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY || 'test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # backend-ghcr 와 같은 기준. 실제로 여기서 CRITICAL 3건이 먼저 떴고(nginx:1.25-alpine 이 물던
      # Alpine 3.19 는 지원 종료라 수정본이 오지 않았다), 예고대로 **스캔을 끄지 않고 베이스 태그를
      # 올려** 해소했다 — 지금은 nginx:1.31-alpine(Alpine 3.24, 취약점 0). 다음에 또 뜨면 같은 답이다.
      - name: Trivy image scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 이미지 잡 집계 — ruleset 의 필수 상태 체크가 걸릴 **고정 이름**을 제공한다.
  #
  # 왜 필요한가: backend-ghcr 는 매트릭스라 체크 이름에 모듈명이 붙어(`… (order-service)` 등 17개)
  # 가변이고, 가변 이름은 필수 체크로 등록할 수 없다. 그래서 이미지 빌드가 PR 에서 빨개져도
  # 머지 버튼은 열려 있었다 — "보이지만 막지는 못하는" 상태. 이 잡이 대표 이름을 맡아 그 간극을 닫는다.
  # (backend-test 매트릭스에 backend-ci 를 둔 것과 같은 구조다.)
  images:
    name: Images - Build & Scan
    runs-on: ubuntu-latest
    needs: [changes, backend-ghcr, frontend-ghcr]
    # always() 가 필수다. 기본 동작은 needs 실패 시 이 잡을 skip 인데, 필수 체크에서 skip 은
    # 통과로 취급된다 — 이미지 빌드가 깨져도 게이트가 조용히 사라진다.
    if: always() && !cancelled()
    permissions:
      contents: read
    steps:
      - name: 이미지 잡 결과 집계
        env:
          # 게이트 입력값을 로그에 남긴다 — skipped 의 원인이 "빌드할 게 없어서"인지
          # "게이트가 잘못 꺼져서"인지 사후에 구분할 수 있어야 한다(2026-08-20 실측 사고).
          BUILD_ANY: ${{ needs.changes.outputs.build_any }}
          BUILD_MATRIX: ${{ needs.changes.outputs.build_matrix }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          backend="${{ needs.backend-ghcr.result }}"
          frontend="${{ needs.frontend-ghcr.result }}"
          echo "backend-ghcr : $backend"
          echo "frontend-ghcr: $frontend"
          echo "changes.build_any    : '${BUILD_ANY}'"
          echo "changes.build_matrix : '${BUILD_MATRIX}'"
          echo "changes.frontend     : '${FRONTEND_CHANGED}'"
          # skipped 는 "그 영역에 변경이 없어 빌드할 이미지가 없다" 는 뜻이라 통과시킨다.
          # 다만 failure/cancelled 를 스킵으로 둔갑시키지는 않는다 — 그게 이 잡의 존재 이유다.
          for result in "$backend" "$frontend"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::이미지 빌드/스캔이 통과하지 않았다 (result=$result)"; exit 1 ;;
            esac
          done
          # skipped 자체가 정당한지까지 검사한다.
          #
          # 2026-08-20 실측: changes 잡이 build_any=true, build_matrix 에 order-service 1건을
          # 담았는데도 backend-ghcr 이 skipped 로 끝났다. 이 집계 스텝은 skipped 를 무조건
          # 통과로 취급했기 때문에 **필수 체크가 초록인데 이미지는 없는** 상태가 만들어졌고,
          # 운영은 옛 이미지에 묶인 채 9 시간 롤아웃이 멈춰 있었다.
          # "빌드할 게 있었는데 안 빌드됐다" 는 초록이 아니라 빨강이어야 한다.
          if [ "$backend" = "skipped" ] && [ "${BUILD_ANY}" = "true" ]; then
            echo "::error::backend-ghcr 이 skipped 인데 빌드 대상이 있었다 (build_matrix=${BUILD_MATRIX}). 이미지가 만들어지지 않았으므로 초록으로 통과시키지 않는다."
            exit 1
          fi
          if [ "$frontend" = "skipped" ] && [ "${FRONTEND_CHANGED}" = "true" ]; then
            echo "::error::frontend-ghcr 이 skipped 인데 frontend 변경이 있었다. 이미지가 만들어지지 않았다."
            exit 1
          fi
          echo "이미지 빌드·스캔 통과"

  # 현재 배포돼 있는 데모(https://shop.lemuel.co.kr)를 E2E smoke 한다.
  #
  # 2026-08-25 재조준: 이 잡은 settlement 에서 그대로 딸려 오면서 **남의 운영 도메인**
  #   (jen.lemuel.co.kr = settlement-prod)을 때리고 있었다. 그 결과 판정이 두 방향으로 다 틀렸다 —
  #   shop 코드가 깨져도 초록이 뜨고, settlement 가 죽으면 shop 이 빨개졌다. 검증 대상이던
  #   대출 화면은 이 저장소에 존재하지도 않는다.
  #   대상을 shop 자신의 배포처로 바꾸고, 없는 ArgoCD 를 기다리던 `sleep 180` 을 걷어냈다.
  #   shop 데모는 david 노드의 docker compose 다(ADR 0044) — reconcile 을 기다릴 컨트롤러가 없다.
  #
  # 이 잡이 증명하는 것과 아닌 것:
  #   O  지금 그 도메인에 떠 있는 revision 의 라우팅·프록시·인증이 살아 있다
  #   X  방금 만든 이미지가 그 도메인으로 승격됐다 (compose 수동 배포라 승격 단계가 없다)
  #
  # needs 의 4 단계 (ci + ghcr) 를 모두 포함 — ci 가 실패하면 ghcr 는 skipped 되어
  # `result != 'failure'` 는 통과해버림. 그래서 ci.result 도 직접 검사: success/skipped 만 허용.
  # paths-filter 로 변경 없는 쪽은 skipped 되니 success/skipped 양쪽 다 통과시킴.
  deployed-revision-smoke:
    name: Currently deployed demo revision smoke
    runs-on: ubuntu-latest
    needs:
      [frontend-ci, frontend-tests, frontend-ghcr, backend-ci, backend-ghcr]
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && always()
      && !cancelled()
      && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped')
      && (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')
      && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped')
      && (needs.frontend-ghcr.result == 'success' || needs.frontend-ghcr.result == 'skipped')
      && (needs.backend-ghcr.result == 'success' || needs.backend-ghcr.result == 'skipped')
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: https://shop.lemuel.co.kr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 단일 출처: 리포 루트 .nvmrc (node-version-gate 가 frontend/Dockerfile 과 major 일치 강제)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts: 설치 단계에서 의존성의 lifecycle 스크립트를 실행하지 않는다
        # (침해된 패키지가 러너 토큰에 닿는 공급망 경로 차단). 실측 확인 — 이 설치로도
        # vite build·vitest 707건이 그대로 통과한다(esbuild 는 플랫폼 optional dep 로 해결).
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers (chromium/firefox/webkit)
        working-directory: frontend
        run: npm run e2e:install

      # 데모가 살아 있는지 먼저 확인한다 — "닿지 않음" 과 "닿았는데 깨짐" 을 구분하기 위해서다.
      #
      # 이 데모는 가정용 회선의 단일 노드(david)에 compose 로 떠 있다. 전원·회선·터널 어느 하나만
      # 흔들려도 닿지 않는데, 그건 방금 올린 커밋의 잘못이 아니다. 그래서 **닿지 않으면 경고를
      # 남기고 E2E 를 건너뛴다**(잡은 초록). 대신 **닿았는데 E2E 가 깨지면 그대로 빨강**이다.
      #
      # 이 선택의 대가를 분명히 적어 둔다: 데모가 장기간 죽어 있으면 이 게이트는 조용히 아무것도
      # 검증하지 않는다. 그래서 스킵을 로그가 아니라 ::warning:: 애노테이션으로 올려 런 요약에
      # 뜨게 했다 — 초록불 옆에 경고가 계속 보이면 사람이 알아챌 수 있다.
      # 재시도는 3회다. 배포 직후 컨테이너가 뜨는 중인 짧은 창을 "죽음" 으로 오판하지 않기 위한 것이다.
      - name: Probe deployed demo
        id: probe
        env:
          BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
        run: |
          set -uo pipefail
          reachable=false
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/actuator/health" || echo 000)
            echo "시도 ${attempt}/3 — ${BASE_URL}/actuator/health → ${code}"
            if [ "$code" = "200" ]; then reachable=true; break; fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "reachable=$reachable" >> "$GITHUB_OUTPUT"
          if [ "$reachable" != "true" ]; then
            echo "::warning title=배포 데모에 닿지 않아 E2E 를 건너뛴다::${BASE_URL} 가 3회 시도 동안 200 을 주지 않았다. 이 런은 배포된 revision 을 아무것도 검증하지 않았다."
          fi

      - name: Run Playwright E2E against the deployed demo
        if: steps.probe.outputs.reachable == 'true'
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
