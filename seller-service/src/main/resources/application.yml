spring:
  profiles:
    active: local

  application:
    name: lemuel-seller

  threads:
    virtual:
      enabled: true

  # ★ seller-service 는 자체 DB(lemuel_seller) 를 소유한다 (DB-per-service).
  #   로컬 기본값은 compose 의 호스트 매핑(127.0.0.1:5443 → seller-postgres:5432)을 가리킨다.
  datasource:
    url: jdbc:postgresql://localhost:5443/lemuel_seller?reWriteBatchedInserts=true
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: lemuel-seller-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      leak-detection-threshold: 30000
      # 형제 서비스와 같은 이유로 둔다 — 파드와 postgres 가 다른 노드에 있으면 유휴 커넥션이
      # CNI/conntrack 상태 만료로 소리 없이 끊기고, 다음 borrow 에서 08003 으로 터진다.
      max-lifetime: 1800000     # 30분
      keepalive-time: 300000    # 5분

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # ★ shared-common OutboxSchema 가 이 값을 읽어 outbox 네이티브 쿼리의 스키마를 정한다.
        #   (@Value("${spring.jpa.properties.hibernate.default_schema:public}")) — 여기와
        #   flyway.schemas 가 어긋나면 폴러가 없는 테이블을 찾는다.
        default_schema: seller
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # 자체 DB 마이그레이션을 직접 책임진다 (V1 셀러 코어, V2 outbox/멱등 인프라).
  flyway:
    enabled: true
    schemas: seller
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  # Kafka — 구독(사본 갱신) + 발행(승인·출고 요청).
  # group-id 는 모듈 소유 규칙(guard KAFKA-GROUP-OWNER): <module>-service → lemuel-<module>.
  # auto-offset-reset=earliest — 심사·출고 화면이 사본 위에 서 있다. 놓친 구간은 "주문이 없는
  # 셀러"로 보이고, 그 상태에서 셀러는 출고할 것이 없다고 판단한다.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: lemuel-seller
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8104
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
    db:
      enabled: true
  server:
    port: 8105
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Kafka 컨슈머·인프라 빈 토글 (shared-common KafkaConfig + 컨슈머의 @ConditionalOnProperty).
  # 로컬/테스트 기본 off — 브로커 없이 부팅. compose/운영에서 APP_KAFKA_ENABLED=true 주입.
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    topic:
      # ADR 0035 — owner 는 "이 모듈이 발행(소유)하는 토픽" 선언이다.
      owner: seller-service
      # 발행 — 남의 원장을 바꿔 달라는 요청 두 개. 실제 쓰기는 order-service 가 한다.
      seller-product-approved: ${SELLER_TOPIC_PRODUCT_APPROVED:lemuel.seller.product_approved}
      seller-shipment-registered: ${SELLER_TOPIC_SHIPMENT_REGISTERED:lemuel.seller.shipment_registered}
      # 구독 — 화면을 그리는 사본의 입력.
      order-created: ${SELLER_TOPIC_ORDER_CREATED:lemuel.order.created}
      payment-captured: ${SELLER_TOPIC_PAYMENT_CAPTURED:lemuel.payment.captured}
      payment-refunded: ${SELLER_TOPIC_PAYMENT_REFUNDED:lemuel.payment.refunded}
      product-changed: ${SELLER_TOPIC_PRODUCT_CHANGED:lemuel.product.changed}
      # 승인 요청의 되돌아오는 절반 — 카탈로그에 실제로 실린 상품번호가 여기로 온다.
      # 이게 없으면 셀러 화면의 신청서는 영원히 "승인됨, 상품번호 없음" 으로 남는다.
      product-registered: ${SELLER_TOPIC_PRODUCT_REGISTERED:lemuel.product.registered}
      organization-created: ${SELLER_TOPIC_ORGANIZATION_CREATED:lemuel.organization.created}
      organization-member-joined: ${SELLER_TOPIC_ORGANIZATION_MEMBER_JOINED:lemuel.organization.member_joined}
      organization-member-removed: ${SELLER_TOPIC_ORGANIZATION_MEMBER_REMOVED:lemuel.organization.member_removed}
      organization-member-role-changed: ${SELLER_TOPIC_ORGANIZATION_MEMBER_ROLE_CHANGED:lemuel.organization.member_role_changed}

  # Outbox → Kafka 발행 폴링 주기 (harness outbox-poller-gate).
  outbox:
    polling-delay-ms: ${APP_OUTBOX_POLLING_DELAY_MS:2000}

  # JWT — shared-common JwtProperties(prefix=app.jwt). 루트 스캔이 common.config.jwt 를 잡으므로
  # secret 이 필수다(order-service 와 동일 시크릿이어야 회원 토큰이 여기서도 검증된다).
  jwt:
    issuer: ${JWT_ISSUER:lemuel}
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
