# david 노드(데모 배포) 전용 compose 오버라이드 — shop.lemuel.co.kr
#
# ⚠ 이 파일은 저장소 루트에 두면 안 된다. compose 는 작업 디렉터리의 docker-compose.override.yml
#   을 **자동으로** 읽으므로, 루트에 두는 순간 모든 개발자의 로컬 `docker compose up` 이
#   프론트를 0.0.0.0:3000 으로 열게 된다. 그래서 deploy/<노드>/ 아래에 두고 david 에서만
#   명시적으로 지정해 쓴다.
#
# 왜 필요한가: 리포 기본값은 모든 포트를 127.0.0.1 에 묶는다(docker-compose.yml).
# 그런데 shop.lemuel.co.kr 트래픽은 Cloudflare Tunnel(르무엘 호스트)에서 david:3000 으로
# 들어오므로, 프론트 하나만 LAN 에 노출해야 한다. 나머지 16개 서비스는 loopback 그대로 둔다.
#
# 사용법 (david 에서):
#   docker compose -f docker-compose.yml -f deploy/david/docker-compose.override.yml up -d
#
# ⚠ 프론트는 nginx.compose.conf 를 **파일 하나로 bind mount** 한다. 파일 bind mount 는 경로가
#   아니라 inode 를 붙잡으므로, `git checkout`/`git pull` 이 그 파일을 새 inode 로 갈아끼우면
#   호스트 파일만 바뀌고 컨테이너 안은 옛 내용 그대로 남는다. `up -d` 는 이미지·환경이 그대로면
#   컨테이너를 다시 만들지 않으므로 이 어긋남을 고치지 못한다. 즉 프록시 대상 세그먼트를 고쳐도
#   조용히 반영이 안 된다 — 2026-08-28 에 /inquiries 가 게이트웨이 대신 SPA 로 떨어져
#   목록 대신 index.html 이 돌아왔고(HTTP 200 이라 감시에도 안 걸렸다) 3일 만에 발견했다.
#
#   그래서 nginx.compose.conf 가 바뀐 배포에서는 반드시:
#     docker compose -f docker-compose.yml -f deploy/david/docker-compose.override.yml \
#       up -d --force-recreate frontend
#   확인은 호스트 파일이 아니라 컨테이너 안을 본다:
#     docker exec lemuel-frontend cat /etc/nginx/conf.d/default.conf | grep -c inquiries
#   (dist/ 는 디렉터리 mount 라 이 함정이 없다 — rsync 로 갈아끼우면 바로 반영된다.)
#
# 배경과 "왜 아직 쿠버네티스가 아닌가"는 docs/adr/0044-deployment-stays-on-compose.md 참조.
services:
  frontend:
    ports: !override
      - "3000:80"
