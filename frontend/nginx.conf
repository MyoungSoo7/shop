server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Backend proxy ──────────────────────────────────────────────────────
    # 모든 REST API 엔드포인트는 백엔드 Service(settlement-app:8080)로 프록시.
    # SPA fallback 보다 먼저 매칭되어야 함.
    # ⚠️ /admin 은 프론트 SPA 라우트(/admin/system/*, /admin/operation, /admin/ceo/*, /admin/settlement 등)와
    #    프리픽스를 공유한다. 백엔드 admin API 를 allowlist 로 열거하면 신규 API(menus/common-codes/rbac/market…)
    #    가 늘 때마다 누락돼 깨지므로, 반대로 처리한다: 프론트 SPA admin 라우트만 index.html 로 예외 폴백하고
    #    (아래 별도 location), 나머지 /admin/* 는 전부 gateway 로 프록시한다 (딥링크/F5 새로고침도 정상).
    #    허용 목록은 <b>상단 네비 그룹의 접두사</b>다 — 관리자 화면 URL 은 전부 `/admin/<그룹>/<화면>`
    #    꼴이라, 그룹을 등록하면 그 아래 화면은 자동으로 따라온다. 여기에 <b>화면 하나의 이름</b>을
    #    더하고 싶어진다면 대개 오답이다: 같은 이름의 백엔드 API 가 있으면 이번엔 프론트가 그 API 를
    #    못 부른다(index.html 이 응답된다). 그 오답은 spa-fallback-gate 가 막는다.
    location ~ ^/admin(/(system|operation|shipping|approvals|login)(/|$)|/?$) {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # AI 챗봇 SSE 스트리밍 — settlement-service 의 ai 슬라이스가 서빙(ADR 0040) — 버퍼링을 끄지 않으면 delta 이벤트가 묶여서 도착한다.
    # ^~ 프리픽스 매칭은 아래 regex 매칭보다 우선한다. 유한 응답 스트림이라 120s (LLM 생성이 60s 초과 가능).
    location ^~ /api/ai/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # market-stream 실시간 시세 SSE — 버퍼링을 끄지 않으면 틱이 묶여서 도착한다. 장기 연결 허용.
    location ^~ /api/market-stream/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # notification 알림 푸시 SSE — 시세 스트림과 같은 이유로 버퍼링을 끄고 장기 연결을 허용한다.
    # 이 location 이 없으면 아래 일반 "api" 세그먼트로 떨어져 proxy_buffering on + read timeout 60s
    # 를 받는다 — 하트비트가 15s 라 연결은 유지되지만 이벤트가 버퍼에 묶여 실시간이 아니게 되고,
    # gateway 직결(개발)에서만 정상 동작해 배포 경로에서만 깨지는 형태가 된다.
    #
    # 정확 일치(=)인 이유: gateway 도 /api/notifications/stream 만 라우팅하고 와일드카드를 금지한다
    # (발송·데모는 /internal/notifications/** 라 노출 대상이 아니다). 여기서
    # 프리픽스로 열면 그 결정을 프록시 층에서 되돌리는 셈이다. 쿼리스트링(?token=)은 location
    # 매칭에 영향을 주지 않으므로 EventSource 인증 경로도 그대로 탄다. 정본: docs/sse.md
    location = /api/notifications/stream {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # card-service(/api/cards/**) 는 organization·investment·account·ai·market·company·economics·
    # common-data 등 나머지 /api/<서비스>/** 형 서비스와 동일하게 아래 일반 "api" 세그먼트로 이미
    # gateway 프록시된다 — 별도 location 불필요(전례: 위 서비스들도 개별 location 없음).
    # display-sections: 진열 편성 공개 조회(/display-sections/**). 관리 표면은 /admin 세그먼트로 이미
    # 들어오지만 공개 표면은 자기 세그먼트라, 여기 없으면 SPA 폴백(index.html)이 먹혀 조용히 200 HTML 을 준다.
    # 세그먼트 목록은 게이트웨이 라우트와 짝이다 — 한쪽에만 있으면 브라우저에서 닿지 않는다.
    # gateway-route-gate 가 두 conf 와 gateway application.yml 을 대조해 드리프트를 막는다.
    location ~ ^/(auth|api|admin|users|orders|payments|reviews|settlements|loans|categories|display-sections|memberships|coupons|games|products|tags|refunds|chargebacks|ledger|actuator|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing - serve index.html for all routes
    # index.html 은 절대 캐시하지 않는다 — 새 빌드(해시된 청크) 참조를 즉시 반영하기 위함.
    # (해시 에셋은 immutable 캐시, HTML 만 항상 재검증)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (nginx 자체 헬스 — K8s probe용)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
