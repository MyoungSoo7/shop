global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lemuel-prod'
    replica: '1'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - 'alert-rules.yml'

# Scrape configurations
scrape_configs:
  # Lemuel Spring Boot Application (order-service) — compose 서비스명 order-service:8080
  - job_name: 'lemuel'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8080']
        labels:
          application: 'lemuel'
          environment: 'production'

  # operation-service — 운영 관제(인시던트). 관제의 관제: 이 서비스가 죽으면 인시던트 수집이 침묵하므로
  # up{job="operation"} 알람(OperationServiceDown)의 소스가 된다.
  - job_name: 'operation'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['operation-service:8080']
        labels:
          application: 'lemuel-operation'
          environment: 'production'

  # marketing-service — 이벤트 프로모션(출석체크·럭키박스). 보상은 여기서 요청만 하고 원장은
  # order 가 쥔다. 그래서 이 서비스가 죽으면 "포인트가 안 들어온다" 가 아니라 참여 자체가 막히고,
  # 이미 REQUESTED 로 나간 건은 돌아올 곳을 잃는다(marketing_reward_stuck_count 가 그걸 센다).
  #
  # 이 잡이 없던 동안 marketing 은 /actuator/prometheus 로 지표를 다 내보내면서 아무도 긁어가지
  # 않는 상태였다 — 앱은 계측돼 있고 알람 규칙도 up{} 을 보는데, 시계열이 아예 없으니 규칙이
  # 발화할 수 없다. "계측했다" 와 "감시된다" 는 다른 말이다.
  - job_name: 'marketing'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['marketing-service:8080']
        labels:
          application: 'lemuel-marketing'
          environment: 'production'

  # partner-service — 입점사 콘솔(조직·매출 프로젝션). marketing 과 똑같은 자리에서 똑같이
  # 빠져 있었다. 배포 로스터 게이트(scripts/harness/test/deploy-roster-gate.test.mjs)가
  # marketing 의 누락을 잡으려고 2026-08-28 에 생겼는데, 그 다음 서비스가 같은 구멍으로
  # 들어왔다 — 게이트는 재발을 막은 게 아니라 재발을 *보이게* 만든 것이다. 그게 일이다.
  #
  # 이 서비스는 매출 프로젝션을 들고 있어 조용히 죽으면 입점사 화면의 숫자가 굳는다.
  # 굳은 숫자는 0 처럼 보이지 않아서 사람 눈으로는 거의 안 잡힌다.
  - job_name: 'partner'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['partner-service:8080']
        labels:
          application: 'lemuel-partner'
          environment: 'production'

  # gateway-service — 모든 외부 요청이 지나는 자리. 여기가 죽으면 뒤가 전부 멀쩡해도 사용자에겐
  # 사이트 전체가 죽은 것이다. 백엔드 지표만 보고 "다 초록" 이라고 읽는 상태를 막는다.
  #
  # 게이트웨이는 앱 포트가 곧 8080 이라 compose 에서 MANAGEMENT_SERVER_PORT 를 따로 주지 않는다
  # (나머지 셋은 로컬 dev 에서 관리 포트가 분리돼 있어 compose 가 8080 으로 합친다).
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:8080']
        labels:
          application: 'lemuel-gateway'
          environment: 'production'

  # kafka-exporter — Redpanda 컨슈머 그룹 lag/오프셋 (브로커 관점, 파티션별).
  # actuator 의 client-side lag 과 달리 모든 그룹·토픽·파티션의 정확한 lag 을 노출. Grafana lag 대시보드 소스.
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # postgres-exporter — PostgreSQL 통계(pg_stat_database_deadlocks 등). operation-service 의
  # DB_DEADLOCK 신호 폴링 소스.
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # redis-exporter — Redis 가용성(redis_up 등). operation-service 의 REDIS_FAILURE 신호 폴링 소스.
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
