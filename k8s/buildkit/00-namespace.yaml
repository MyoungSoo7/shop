apiVersion: v1
kind: Namespace
metadata:
  name: build
  labels:
    app.kubernetes.io/part-of: shop-ci
# 이 네임스페이스에는 LimitRange 를 두지 않는다.
# 클러스터의 LimitRange 9개(argocd·asat·crypto-prod·…)는 컨테이너당 상한을 강제하는데,
# 빌드 파드는 그 상한(특히 memory limit/request ratio)에 걸려 "파드가 만들어지지도 않는"
# 실패로 나타난다 — 이벤트가 Job 이 아니라 ReplicaSet/Job describe 에만 남아 진단이 어렵다.
